name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day at 00:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # If some cards are missing in the output folder, create a personal access
          # token, save it as a repo secret named METRICS_TOKEN and use that instead.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
